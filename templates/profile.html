<!doctype html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{profile_name}}</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="profile-number">{{profile_number}}</div>
    <a class="logout" href="/logout">Odhlásiť sa</a>
  </header>

  <main class="card">
    <h1>{{profile_name}}</h1>
    {{message}}

    <form method="post" action="/profile" enctype="multipart/form-data">
      <label for="file">Nahrať súbor</label>
      <input id="file" name="file" type="file" required>

      <label for="description">Popis</label>
      <textarea id="description" name="description" rows="4" required></textarea>
      <button type="submit">Odoslať</button>
      <span class="hint">Súbor aj popis sa uložia do priečinka profilu.</span>
    </form>

    <section class="downloads">
      <h2>Nahrané súbory</h2>
      <ul>
        {{files}}
      </ul>
    </section>
  </main>
</body>
</html>
