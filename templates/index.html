<!doctype html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prihlásenie</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="card">
    <h1>Prihlásenie cez prístupový kľúč</h1>
    <p>Zadajte kľúč, aby sa otvoril príslušný profil.</p>
    {{message}}

    <form method="post" action="/">
      <label for="access_key">Prístupový kľúč</label>
      <input id="access_key" name="access_key" type="text" required placeholder="napr. T4B-Q7L">
      <button type="submit">Prihlásiť sa</button>
    </form>
  </main>
</body>
</html>
